name: Release

# git tag v0.1.0 && git push origin v0.1.0  →  installers for macOS / Windows / Linux.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            triple: aarch64-apple-darwin
            bundles: app
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The package bundle is downloaded on first use; keeping it makes later runs immune to
      # network hiccups and faster.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/Library/Caches/TectonicProject.Tectonic
            ~/AppData/Local/TectonicProject/Tectonic
          key: tectonic-bundle-${{ runner.os }}-v1

      # ── Tectonic (externalBin) + smoke test on this OS ─────────────────────────
      - shell: bash
        run: ./scripts/fetch-tectonic.sh ${{ matrix.triple }}
      - shell: bash
        run: ./scripts/smoke-tectonic.sh app/src-tauri/binaries/tectonic-${{ matrix.triple }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # ── Rust + Node ────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build Tauri bundle
        working-directory: app
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Zip macOS .app
        if: runner.os == 'macOS'
        working-directory: app/src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent praTexEditOR.app praTexEditOR-macOS-aarch64.zip

      - name: List bundle output
        if: always()
        shell: bash
        run: find app/src-tauri/target/release/bundle -maxdepth 2 -type f 2>/dev/null || true

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/macos/*.zip
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload workflow artifacts (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: praTexEditOR-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/macos/*.zip
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
